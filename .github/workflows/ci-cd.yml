name: Customer Churn MLOps CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  test-and-build:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------
      # CHECKOUT
      # --------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------
      # PYTHON
      # --------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # --------------------------------------------
      # DEPENDENCIES
      # --------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # --------------------------------------------
      # CHECK MODEL EXISTS
      # --------------------------------------------

      - name: Check production model
        run: |
          test -f models/churn_model.joblib
          echo "Production model found"


      # --------------------------------------------
      # CHECK PYTHON CODE
      # --------------------------------------------

      - name: Validate Python files
        run: |
          python -m compileall src monitoring dashboard


      # --------------------------------------------
      # TEST MODEL LOADING
      # --------------------------------------------

      - name: Test model loading
        run: |
          python -c "import joblib; joblib.load('models/churn_model.joblib'); print('Model loaded successfully')"


      # --------------------------------------------
      # BUILD DOCKER IMAGE
      # --------------------------------------------

      - name: Build Docker image
        run: |
          docker build -t customer-churn-mlops .


      # --------------------------------------------
      # COMPLETE
      # --------------------------------------------

      - name: CI/CD completed
        run: |
          echo "Customer Churn MLOps pipeline passed successfully"